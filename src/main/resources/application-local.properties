spring.application.name=langchain4j
server.port=8082
## 大模型配置
langchain4j.community.dashscope.chat-model.api-key=sk-c141840eb5b448e9900a66b90c43f7d4
langchain4j.community.dashscope.chat-model.model-name=qwen-max

## 大模型流式输出
langchain4j.community.dashscope.streaming-chat-model.api-key=sk-c141840eb5b448e9900a66b90c43f7d4
langchain4j.community.dashscope.streaming-chat-model.model-name=qwen-max

## 大模型 向量嵌入模型
langchain4j.community.dashscope.embedding-model.api-key=sk-c141840eb5b448e9900a66b90c43f7d4
langchain4j.community.dashscope.embedding-model.model-name=text-embedding-v3

# 数据源配置（本地 PostgreSQL）
spring.datasource.url=jdbc:postgresql://localhost:5432/ai_agent
spring.datasource.username=postgres
spring.datasource.password=postgres

# Redis（本地）
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=

# MyBatis 配置
mybatis.mapper-locations=classpath:mappers/*.xml
mybatis.type-aliases-package=com.example.langchain4j.repository.entity
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl


