spring.application.name=langchain4j
spring.profiles.active=local
server.port=8081

# 优雅停机：等待在途请求与图执行任务收尾
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

## 大模型配置（阿里云百炼 qwen，密钥通过环境变量注入，避免入库）
langchain4j.community.dashscope.chat-model.api-key=${DASHSCOPE_API_KEY:}
langchain4j.community.dashscope.chat-model.model-name=qwen-max
langchain4j.community.dashscope.chat-model.temperature=0.7

## 大模型流式输出
langchain4j.community.dashscope.streaming-chat-model.api-key=${DASHSCOPE_API_KEY:}
langchain4j.community.dashscope.streaming-chat-model.model-name=qwen-max

## 大模型向量嵌入模型（text-embedding-v3 输出 1024 维；已被本地 BGE-M3 替换，此配置仅用于保留 dashscope 装配）
langchain4j.community.dashscope.embedding-model.api-key=${DASHSCOPE_API_KEY:}
langchain4j.community.dashscope.embedding-model.model-name=text-embedding-v3

## 本地向量模型（Ollama 部署 BGE-M3，1024 维；切换后需清空重建知识库向量）
agent.embedding.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
agent.embedding.model-name=bge-m3

## DeepSeek 官方 API（OpenAI 兼容协议，走 api.deepseek.com；百炼平台 deepseek 系列已于 2026-10-10 下架不可用）
agent.deepseek.api-key=${DEEPSEEK_API_KEY:}
agent.deepseek.base-url=https://api.deepseek.com
agent.deepseek.model-name=deepseek-flash

## PostgreSQL 数据源（HikariCP 连接池，业务数据 + pgvector）
spring.datasource.url=jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${PG_DB:ai_agent}
spring.datasource.username=${PG_USERNAME:postgres}
spring.datasource.password=${PG_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-test-query=SELECT 1
# 数据库不可达时允许应用启动（checkpoint/业务降级），生产环境建议设置为 false
spring.datasource.hikari.initialization-fail-timeout=-1

# 业务表 DDL 由 SchemaInitializer 后台容错执行（PG 不可达时仅告警不阻断启动，幂等可重试）
spring.sql.init.mode=never

# MyBatis 配置
mybatis.mapper-locations=classpath:mappers/*.xml
mybatis.type-aliases-package=com.example.langchain4j.repository.entity
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.default-fetch-size=100
# 生产建议使用日志框架而非 stdout
mybatis.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl

## Redis（限流 / 分布式锁 / 缓存）
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=3s
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=3s

## Agent 运行参数
# 多模型路由：前端传 model 参数时按模型名路由，不传用默认模型
agent.llm.default-model=deepseek-flash
# 千问模型名（必须与上方 langchain4j.community.dashscope.chat-model.model-name 保持一致）
agent.llm.qwen-model-name=qwen-max
# Checkpoint 持久化：PostgresSaver 不可用时是否降级内存（本地无 DB 也可启动）
agent.checkpoint.memory-fallback=true
# 图执行专用线程池（隔离图执行与 HTTP 线程）
agent.executor.core-pool-size=4
agent.executor.max-pool-size=16
agent.executor.queue-capacity=200
agent.executor.keep-alive-seconds=60
# LLM 网关防护参数
agent.llm.timeout-seconds=60
agent.llm.max-retries=3
agent.llm.circuit-breaker.failure-threshold=5
agent.llm.circuit-breaker.cooldown-seconds=60
# 限流参数（令牌桶，按 userId 维度）
agent.rate-limit.enabled=true
agent.rate-limit.permits-per-minute=60
# Redis 故障时限流自动放行（fail-open），保证可用性优先
agent.rate-limit.fail-open=true
# 会话锁由 Redisson RLock 实现（Watchdog 看门狗自动续期，无需固定 TTL）
# 单次图执行整体超时（秒），超时返回降级应答（取消后台任务，一问一答照常落库），用户可直接重发
agent.execution-timeout-seconds=240
# 多轮上下文：改写与生成注入历史的最近消息条数
agent.history-window-size=10

## 可观测性（Actuator + Prometheus）
# 暴露端点：health 供部署探针，prometheus 供指标采集（application.yml 里的 metrics/info 默认只读不暴露）
management.endpoints.web.exposure.include=health,info,prometheus
# 启用 k8s 风格存活/就绪探针（/actuator/health/liveness、/actuator/health/readiness）
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
# 指标元数据（应用名+环境标签，Prometheus 侧按此过滤）
management.prometheus.metrics.export.descriptions=true
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.env=local
