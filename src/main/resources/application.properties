spring.application.name=langchain4j
spring.profiles.active=local
server.port=8081

# 优雅停机：等待在途请求与图执行任务收尾
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

## 大模型配置（阿里云百炼 qwen，密钥通过环境变量注入，避免入库）
langchain4j.community.dashscope.chat-model.api-key=${DASHSCOPE_API_KEY:}
langchain4j.community.dashscope.chat-model.model-name=qwen-max
# 客服知识问答统一低温求稳（与 DeepSeek 配置一致）
langchain4j.community.dashscope.chat-model.temperature=0.3

## 本地向量模型（Ollama 部署 BGE-M3，1024 维；切换后需清空重建知识库向量）
agent.embedding.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
agent.embedding.model-name=bge-m3

## 知识库父子分块（子块同时受字符数与 token 估算双约束；父块按章节语义优先）
## parent-chunk-size 是父块硬上限，超长会继续语义续切。
## parent-target-min/max 是选层目标区间：逐层统计同层标题的整棵子树长度，中位数需落在此区间。
agent.knowledge.parent-chunk-size=2000
agent.knowledge.parent-target-min=800
agent.knowledge.parent-target-max=2000
agent.knowledge.chunk-size=400
agent.knowledge.chunk-overlap=80
agent.knowledge.chunk-token-limit=512
agent.knowledge.max-document-chars=50000
## 文档版本发布：旧版本保留窗口与回收（GC 在事务外分批删除，不影响在线读）
agent.knowledge.version-retention-hours=24
agent.knowledge.gc-enabled=true
agent.knowledge.gc-max-documents=50
agent.knowledge.gc-batch-size=500
agent.knowledge.gc-interval-ms=3600000
## 导入中断判定：超过该时长仍为 IMPORTING 视为进程异常退出，允许新导入接管
agent.knowledge.import-stale-minutes=30

## 检索装配预算：最多 3 个父块组，单组 2000 字，总预算 5000 字
agent.retrieval.context-budget=5000
agent.retrieval.max-parents=3
agent.retrieval.parent-context-budget=2000
# 证据优先检索：先用主查询做轻量探针，证据不足/复杂问题再升级完整检索
agent.retrieval.probe-top-k=3
agent.retrieval.full-top-k=6
agent.retrieval.deep-top-k=8
# 复合问题按子问题公平分配上下文，避免第一个子问题吃掉全部预算
agent.retrieval.compound-per-query-context-budget=2200
agent.retrieval.compound-context-budget=8000
# 证据阈值：需用离线验证集校准；数值越高越保守（更容易升级完整检索/质检）
agent.retrieval.min-evidence-confidence=0.45
agent.retrieval.min-keyword-coverage=0.20
agent.retrieval.rrf-score-scale=0.033
agent.retrieval.min-answer-support=0.12

## DeepSeek 官方 API（OpenAI 兼容协议，走 api.deepseek.com；百炼平台 deepseek 系列已于 2026-10-10 下架不可用）
agent.deepseek.api-key=${DEEPSEEK_API_KEY:}
agent.deepseek.base-url=https://api.deepseek.com
# 支持模型列表（逗号分隔）：每个模型注册一个独立实例，前端传 model 参数按名路由；新增模型只改此处
agent.deepseek.model-names=deepseek-flash,deepseek-v4-pro

## 安全认证（JWT Bearer：白名单 /api/auth/** 与 /actuator/**，其余 /api/** 需携带 Authorization 头）
auth.jwt.secret=${JWT_SECRET:langchain4j-demo-jwt-secret-change-me-in-production-0123456789}
# Token 有效期（小时），过期后需重新登录
auth.jwt.expire-hours=72

## PostgreSQL 数据源（HikariCP 连接池，业务数据 + pgvector）
spring.datasource.url=jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${PG_DB:ai_agent}
spring.datasource.username=${PG_USERNAME:postgres}
spring.datasource.password=${PG_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-test-query=SELECT 1
# 数据库不可达时允许应用启动（checkpoint/业务降级），生产环境建议设置为 false
spring.datasource.hikari.initialization-fail-timeout=-1

# 业务表 DDL 由 SchemaInitializer 后台容错执行（PG 不可达时仅告警不阻断启动，幂等可重试）
spring.sql.init.mode=never

# MyBatis 配置
mybatis.mapper-locations=classpath:mappers/*.xml
mybatis.type-aliases-package=com.example.langchain4j.repository.entity
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.default-fetch-size=100
# 生产建议使用日志框架而非 stdout
mybatis.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl

## Redis（统一 Redisson 客户端：限流 / 分布式锁 / 熔断计数 / 缓存）
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=3s
# 连接池由 Redisson Netty 管理（默认最小空闲 24 / 最大 64），Lettuce 池参数已随客户端迁移移除

## Agent 运行参数
# 多模型路由：前端传 model 参数时按模型名路由，不传用默认模型
agent.llm.default-model=deepseek-flash
# 千问模型名（必须与上方 langchain4j.community.dashscope.chat-model.model-name 保持一致）
agent.llm.qwen-model-name=qwen-max
# Checkpoint 持久化：PostgresSaver 不可用时是否降级内存（本地无 DB 也可启动）
agent.checkpoint.memory-fallback=true
# 图执行专用线程池（隔离图执行与 HTTP 线程）
agent.executor.core-pool-size=4
agent.executor.max-pool-size=16
agent.executor.queue-capacity=200
agent.executor.keep-alive-seconds=60
# LLM 网关防护参数
agent.llm.timeout-seconds=60
agent.llm.max-retries=3
# 单模型每分钟调用上限：入口限流保护服务，这一层保护上游模型配额（<=0 关闭）
agent.llm.max-calls-per-minute=120
agent.llm.backoff-base-ms=1000
agent.llm.backoff-jitter-ms=500
# 结构化输出（generateJson）最大输出 token 数（JSON 节点输出短小，1024 足够；触顶截断，调用方 fail-open 降级）
agent.llm.max-output-tokens=1024
# 动态回答预算：简单问题短答、复合问题适度展开、deep 保留完整输出
agent.llm.answer-budget.chitchat.max-chars=120
agent.llm.answer-budget.chitchat.max-output-tokens=256
agent.llm.answer-budget.knowledge-simple.max-chars=500
agent.llm.answer-budget.knowledge-simple.max-output-tokens=1024
agent.llm.answer-budget.knowledge-compound.max-chars=900
agent.llm.answer-budget.knowledge-compound.max-output-tokens=1536
agent.llm.answer-budget.knowledge-deep.max-chars=2800
agent.llm.answer-budget.knowledge-deep.max-output-tokens=4096
# 代码生成长度无法按字数约束：max-chars=0 只保留 token 硬上限
agent.llm.answer-budget.code.max-chars=0
agent.llm.answer-budget.code.max-output-tokens=6144
agent.llm.circuit-breaker.failure-threshold=5
agent.llm.circuit-breaker.cooldown-seconds=60
# 限流参数（Redis 固定窗口，按 userId 维度，多实例共享计数）
agent.rate-limit.enabled=true
agent.rate-limit.permits-per-minute=60
# Redis 故障时限流自动放行（fail-open），保证可用性优先
agent.rate-limit.fail-open=true
# 会话锁由 Redisson RLock + 显式租约实现（到期自动释放，不使用 Watchdog 续期）
# 租约必须大于最长图执行耗时（execution-timeout-seconds=240）
agent.lock.lease-seconds=300
# 单次图执行整体超时（秒），超时返回降级应答（取消后台任务，一问一答照常落库），用户可直接重发
agent.execution-timeout-seconds=240
# 工具运行时：默认只读；写工具白名单仅在 read-only=false 时生效
# 工具白名单：非空时模型只能看到/调用这里列出的工具（启动期校验名字，写错 fail-fast）
agent.tool.enabled-tools=query_demo_record,complete_demo_record
agent.tool.read-only=true
agent.tool.allowed-write-tools=complete_demo_record
agent.tool.confirmation.claim-seconds=600
agent.tool.confirmation.stale-seconds=60
agent.tool.confirmation.ttl-seconds=300
# 多轮上下文（短期记忆）：改写视图与生成视图分离预算，段摘要异步压缩超窗历史
agent.history.rewrite-window-size=4
agent.history.rewrite-item-max-length=800
agent.history.generation-max-tokens=8000
agent.history.generation-item-max-length=4000
agent.history.summary-trigger-messages=10
agent.history.summary-max-messages-per-run=40
agent.history.summary-max-length=4000
agent.history.summary-max-input-item-length=2000
agent.history.summary-max-task-loops=3
agent.history.summary-min-refined-length=50
agent.history.summary-min-retain-ratio=3

# 跨节点通用上限：输入/输出、候选集、审计与任务展示等，集中配置避免散落魔法值
agent.limits.max-query-length=4000
agent.limits.max-retrieval-query-length=400
agent.limits.min-result-length=5
agent.limits.max-validation-reason-length=200
agent.limits.generation-candidate-limit=40
agent.limits.context-snapshot-max=1200
agent.limits.conversation-title-max-length=30
agent.limits.default-message-limit=50
agent.limits.max-message-limit=200
agent.limits.task-answer-max-evidence=5
agent.limits.task-answer-max-snippet=300
agent.limits.task-trace-max-entries=8
agent.limits.task-evidence-max-entries=8
agent.limits.task-summary-max-length=500
agent.limits.audit-json-max-length=4000
agent.limits.rewrite-output-slack=200
agent.limits.default-ticket-limit=50
agent.limits.max-ticket-limit=200

# 对话请求默认选项：客户端未传或传非法值时使用（协议值仍是 auto/deep/all/private）
agent.request.default-answer-mode=auto
agent.request.default-visibility=all

# 检索召回与融合参数：线上按验证集调参，不要直接改代码常量
agent.retrieval.default-top-k=3
agent.retrieval.dense-min-score=0.85
agent.retrieval.sparse-min-score=0.05
agent.retrieval.rrf-k=60
agent.retrieval.fusion-pool=10


## 可观测性（Actuator + Prometheus）
# 暴露端点：health 供部署探针，prometheus 供指标采集（application.yml 里的 metrics/info 默认只读不暴露）
management.endpoints.web.exposure.include=health,info,prometheus
# 启用 k8s 风格存活/就绪探针（/actuator/health/liveness、/actuator/health/readiness）
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
# 指标元数据（应用名+环境标签，Prometheus 侧按此过滤）
management.prometheus.metrics.export.descriptions=true
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.env=local

## API 文档（springdoc-openapi + Knife4j 增强 UI：http://localhost:8082/doc.html）
# 生产环境可设 springdoc.api-docs.enabled=false 关闭文档
springdoc.swagger-ui.path=/swagger-ui.html
# Knife4j 增强开关与中文界面（原版 Swagger UI 仍可用 /swagger-ui.html，两套共存）
knife4j.enable=true
knife4j.setting.language=zh_cn

## 文件上传（知识库文件导入 /api/knowledge/upload）
# 单文件上限 20MB、整请求上限 100MB（默认仅 1MB，不调大会被 multipart 直接拒绝）
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=100MB
