name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:

jobs:
  build:
    name: Build & Test (JDK 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Windows 检出可能丢失 mvnw 可执行位
      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      # 单测/契约测试均不依赖外部服务（纯 Mockito / @WebMvcTest），CI 无需启动 PG/Redis
      - name: Verify (compile + unit tests)
        run: ./mvnw -B verify --no-transfer-progress
